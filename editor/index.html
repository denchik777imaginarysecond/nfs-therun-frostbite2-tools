<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFS The Run Editor</title>
<style>
  :root {
    --bg: #16181d; --panel: #1e2128; --panel2: #252932; --line: #323744; --text: #dfe3ea; --dim: #8b93a3;
    --accent: #e8a33d; --accent-dim: #6b5226; --blue: #6fb3ff; --green: #7ccf8a; --purple: #c89bff; --red: #ff7b7b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { height: 42px; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header b { color: var(--accent); letter-spacing: .3px; }
  header .info { color: var(--dim); font-size: 12px; }
  main { display: grid; grid-template-columns: 380px 1fr; height: calc(100% - 42px); }
  aside { display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--panel); min-height: 0; }
  #q { margin: 10px; padding: 7px 10px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; font: inherit; }
  #q:focus { outline: none; border-color: var(--accent); }
  #side { overflow: auto; flex: 1; padding: 0 4px 10px; }
  .row { display: flex; align-items: center; gap: 6px; padding: 2px 6px; border-radius: 3px; cursor: pointer; white-space: nowrap; }
  .row .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .row:hover { background: var(--panel2); }
  .row.sel { background: var(--accent-dim); }
  .row .tw { width: 12px; color: var(--dim); flex: none; text-align: center; }
  .row .cnt { color: var(--dim); font-size: 11px; margin-left: auto; padding-left: 8px; }
  .ic { font-size: 10px; font-weight: 700; width: 26px; flex: none; text-align: center; border-radius: 3px; padding: 0 2px; }
  .ic.ebx { color: var(--blue); background: #1d2c40; } .ic.texture { color: var(--green); background: #1d3424; } .ic.dir { color: var(--accent); }
  .children { padding-left: 14px; }
  .hint { color: var(--dim); padding: 8px 12px; }
  section { overflow: auto; padding: 16px 20px 40px; min-width: 0; }
  h1 { font-size: 16px; margin: 0 0 4px; word-break: break-all; }
  .meta { color: var(--dim); font-size: 12px; margin-bottom: 14px; word-break: break-all; }
  .inst { border: 1px solid var(--line); border-radius: 5px; margin-bottom: 10px; background: var(--panel); }
  .inst > .ih { display: flex; gap: 8px; align-items: baseline; padding: 7px 10px; cursor: pointer; }
  .inst > .ih .n { color: var(--dim); } .inst > .ih .t { color: var(--purple); font-weight: 600; } .inst > .ih .lbl { color: var(--text); }
  .inst > .ib { border-top: 1px solid var(--line); padding: 4px 0; }
  .inst.closed > .ib { display: none; }
  table.props { width: 100%; border-collapse: collapse; }
  table.props td { padding: 2px 10px; vertical-align: top; border-bottom: 1px solid #22262e; }
  td.k { color: var(--text); white-space: nowrap; width: 1%; }
  td.v { word-break: break-all; font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; }
  td.ty { color: var(--dim); font-size: 11px; white-space: nowrap; width: 1%; text-align: right; }
  .v-bool { color: var(--accent); } .v-num { color: var(--green); } .v-str { color: #e6d08a; } .v-enum { color: var(--purple); }
  .v-ref { color: var(--blue); } .v-null { color: var(--dim); font-style: italic; }
  .grp { cursor: pointer; } .grp .tw { color: var(--dim); display: inline-block; width: 12px; }
  .texview img { max-width: 100%; image-rendering: auto; border: 1px solid var(--line);
    background: repeating-conic-gradient(#2a2e36 0 25%, #20232a 0 50%) 0 0 / 16px 16px; }
  .texview img.actual { max-width: none; }
  .texview img.bg-black { background: #000; } .texview img.bg-white { background: #fff; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 0 0 10px; }
  .tools .sep { width: 10px; } .btn.on { border-color: var(--accent); color: var(--accent); }
  .btn { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; cursor: pointer; font: inherit; }
  .btn:hover { border-color: var(--accent); }
  .err { color: var(--red); }
  .welcome { max-width: 640px; color: var(--dim); } .welcome b { color: var(--text); }
  header .proj { margin-left: auto; } .btn.primary { background: var(--accent); color: #1b1408; border-color: var(--accent); font-weight: 600; }
  td.editable { cursor: pointer; } td.editable:hover { background: #2b303b; outline: 1px dashed var(--accent-dim); }
  td.v input, td.v select { width: 100%; max-width: 360px; background: var(--bg); color: var(--text); border: 1px solid var(--accent); border-radius: 3px; font: inherit; padding: 1px 4px; }
  tr.edited td { background: #2e2716; } tr.edited td.k { box-shadow: inset 3px 0 var(--accent); }
  .undo { background: none; border: 1px solid var(--line); color: var(--accent); border-radius: 3px; cursor: pointer; margin-right: 6px; padding: 0 5px; }
  .badge { background: var(--accent-dim); color: var(--accent); border-radius: 8px; padding: 0 7px; font-size: 11px; }
  .bundles { margin: -6px 0 12px; color: var(--dim); font-size: 12px; } .bundles summary { cursor: pointer; } .bundles div div { padding-left: 16px; }
  .bundles pre { background: var(--panel); border: 1px solid var(--line); padding: 10px; border-radius: 4px; color: var(--text); overflow: auto; }
  .hint0 { color: var(--dim); margin: 0 0 12px; }
  .btn.add { padding: 0 8px; margin-left: 10px; font-size: 11px; } .undo.rm { color: var(--red); }
  .objtools { margin-left: auto; display: flex; gap: 6px; } .btn.small { padding: 0 8px; font-size: 11px; } .btn.danger:hover { border-color: var(--red); color: var(--red); }
  .badge.new { background: #1d3424; color: var(--green); }
  tr.item td.k { color: var(--dim); }
  .refbox { display: flex; flex-direction: column; gap: 6px; padding: 6px 0; font-family: inherit; }
  .refbox input, .refbox select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 3px; padding: 4px 6px; font: inherit; }
  .picks { max-height: 220px; overflow: auto; } .pick { padding: 2px 6px; cursor: pointer; color: var(--blue); } .pick:hover { background: var(--panel2); }
  a.link { color: var(--blue); text-decoration: none; } a.link:hover { text-decoration: underline; }
  .inst.flash { box-shadow: 0 0 0 2px var(--accent); transition: box-shadow .3s; }
  .tq { flex: 1; min-width: 260px; max-width: 640px; padding: 7px 10px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; font: inherit; }
  .tq:focus { outline: none; border-color: var(--accent); }
  table.texts td.v { font-family: inherit; font-size: 13px; white-space: pre-wrap; }
  td.v textarea { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--accent); border-radius: 3px; font: inherit; padding: 3px 6px; resize: vertical; }
  table.changes th { text-align: left; color: var(--dim); font-weight: 400; padding: 4px 10px; border-bottom: 1px solid var(--line); }
  table.changes td { padding: 4px 10px; } table.changes a { color: var(--blue); }
  .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; max-width: 900px; margin: 18px 0 12px; }
  .fld { display: flex; flex-direction: column; gap: 3px; color: var(--dim); font-size: 12px; } .fld:last-child { grid-column: 1 / -1; }
  .fld input, .fld textarea { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font: inherit; }
  .ok { background: #1d3424; border: 1px solid #2f5a3a; padding: 10px 12px; border-radius: 4px; word-break: break-all; } .ok div { margin-top: 4px; }
</style>
</head>
<body>
<header><b>NFS The Run Editor</b><span class="info" id="info">loading…</span><button class="btn proj" id="textsBtn" title="Texts the player sees: menus, car names, hints, subtitles">Texts</button><button class="btn" id="proj">Project</button></header>
<main>
  <aside>
    <input id="q" placeholder="Search assets (e.g. camaro vinyls, menu_mainmenu)…" autocomplete="off">
    <div id="side"></div>
  </aside>
  <section id="view">
    <div class="welcome">
      <h1>Welcome</h1>
      <p>Browse the game's assets on the left, or search by name. Click an <b>EBX</b> asset to see all its objects and values,
      or a <b>TEX</b> texture to see the picture.</p>
      <p>The editor only reads the game files. Values are shown as the game sees them, with the official patch applied.</p>
    </div>
  </section>
</main>
<script>
'use strict';
// replaceChildren() would show null/undefined/false as text ("null"): skip such empty items everywhere
const nativeReplace = Element.prototype.replaceChildren;
Element.prototype.replaceChildren = function (...kids) { return nativeReplace.apply(this, kids.flat().filter((k) => k !== null && k !== undefined && k !== false)); };
// Small DOM helper: el('div', {class: 'x', onclick}, child1, 'text', ...). Text is always inserted as text, never as HTML.
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) e.append(c instanceof Node ? c : String(c));
  return e;
}
async function api(path) {
  const r = await fetch(path);
  const j = r.headers.get('content-type').includes('json') ? await r.json() : null;
  if (!r.ok) throw new Error((j && j.error) || r.statusText);
  return j;
}
async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const side = document.getElementById('side'), view = document.getElementById('view'), q = document.getElementById('q');
const projBtn = document.getElementById('proj');
projBtn.addEventListener('click', () => showProject());
document.getElementById('textsBtn').addEventListener('click', () => showTexts());
let selectedRow = null;

api('/api/info').then((i) => { document.getElementById('info').textContent = `${i.ebx.toLocaleString()} ebx · ${i.textures.toLocaleString()} textures · ${i.game}`; });

// ---------------------------------------------------------------- tree / search
function assetRow(a, label) {
  const row = el('div', { class: 'row', title: a.name, onclick: () => { select(row); openAsset(a); } },
    el('span', { class: 'tw' }), el('span', { class: 'ic ' + a.kind }, a.kind === 'ebx' ? 'EBX' : 'TEX'), el('span', { class: 'nm' }, label));
  return row;
}
function select(row) { if (selectedRow) selectedRow.classList.remove('sel'); selectedRow = row; row.classList.add('sel'); }

async function folder(dir, into) {
  const d = await api('/api/list?dir=' + encodeURIComponent(dir));
  into.replaceChildren();
  for (const sub of d.dirs) {
    const kids = el('div', { class: 'children', hidden: true });
    const tw = el('span', { class: 'tw' }, '▸');
    let loaded = false;
    const row = el('div', { class: 'row', onclick: async () => {
      kids.hidden = !kids.hidden; tw.textContent = kids.hidden ? '▸' : '▾';
      if (!loaded) { loaded = true; kids.append(el('div', { class: 'hint' }, 'loading…')); await folder((d.dir ? d.dir + '/' : '') + sub.name, kids); }
    } }, tw, el('span', { class: 'ic dir' }, '▤'), sub.name, el('span', { class: 'cnt' }, sub.count.toLocaleString()));
    into.append(row, kids);
  }
  for (const f of d.files) into.append(assetRow(f, f.name.split('/').pop()));
}
function showTree() { side.replaceChildren(el('div', { class: 'hint' }, 'loading…')); folder('', side); }

let searchTimer = null;
q.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    if (!q.value.trim()) return showTree();
refreshProjectButton();
    const r = await api('/api/search?q=' + encodeURIComponent(q.value));
    side.replaceChildren(...[...r.results.map((a) => assetRow(a, a.name)),
      r.results.length ? null : el('div', { class: 'hint' }, 'Nothing found.'),
      r.more ? el('div', { class: 'hint' }, 'Showing the first 300 — add more words to narrow down.') : null].filter(Boolean));
  }, 200);
});
showTree();

// ---------------------------------------------------------------- asset views
async function openAsset(a, focusGuid) {
  current = null;
  view.replaceChildren(el('div', { class: 'hint' }, 'loading ' + a.name + '…'));
  try { if (a.kind === 'ebx') { showEbx(await api('/api/ebx?name=' + encodeURIComponent(a.name))); if (focusGuid) focusInstance(focusGuid); } else await showTexture(a.name); }
  catch (e) { view.replaceChildren(el('h1', {}, a.name), el('p', { class: 'err' }, 'Could not open: ' + e.message)); }
}

// a short label for an instance: its Name/Label/Id field if it has one
function instLabel(v) { for (const k of ['Name', 'Label', 'Id', 'ID', 'Text']) if (typeof v[k] === 'string' && v[k]) return v[k]; return ''; }

const EDITABLE = /^(bool|u?int(8|16|32|64)|float|double|enum|ref|cstring|fileref)$/;
let current = null; // the ebx shown now: { doc, openState }

function valueCell(v, kind, doc) {
  const [k, ref] = (kind || '').split(':');
  if (v === null) return el('span', { class: 'v-null' }, 'null');
  if (typeof v === 'object' && '$import' in v) {
    const im = doc.imports[v.$import];
    if (!im || !im.name) return el('span', { class: 'v-ref', title: im ? 'file ' + im.file + ', instance ' + im.instance : '' }, `→ external #${v.$import} (unknown file)`);
    // a link to the other asset; it opens there with the referenced object unfolded
    return el('a', { class: 'v-ref link', href: '#', title: im.name + ' · object ' + im.instance, onclick: (e) => { e.preventDefault(); e.stopPropagation(); openAsset({ name: im.name, kind: 'ebx' }, im.instance); } }, '→ ' + im.name);
  }
  if (typeof v === 'object' && '$instance' in v) {
    const t = doc.instances[v.$instance];
    return el('a', { class: 'v-ref link', href: '#', title: 'Go to this object in the same file', onclick: (e) => { e.preventDefault(); e.stopPropagation(); focusInstance(t && t.guid); } }, `→ #${v.$instance} ${t ? t.value.$type : ''}`);
  }
  if (k === 'bool') return el('span', { class: 'v-bool' }, String(v));
  if (k === 'enum') return el('span', { class: 'v-enum', title: (doc.enums[ref] || []).join(', ') }, String(v));
  if (k === 'cstring') return el('span', { class: 'v-str' }, JSON.stringify(v));
  if (typeof v === 'number' || /int|float|double/.test(k)) return el('span', { class: 'v-num' }, String(v));
  return el('span', {}, typeof v === 'object' ? JSON.stringify(v) : String(v));
}

// change a value on the server, then redraw the asset (folded/unfolded state is kept)
async function setValue(doc, inst, p, value) {
  try { await post('/api/set', { asset: doc.name, instance: inst, path: p, value }); }
  catch (e) { alert('Cannot set this value: ' + e.message); }
  await reloadEbx();
}
// duplicate / delete an object
async function objectOp(doc, inst, what) {
  if (what === 'delete') {
    const warn = inst.usedOutside ? `

WARNING: ${inst.usedOutside} other file(s) of the game reference this object. They would point to nothing.` : '';
    if (!confirm(`Delete object #${inst.index} ${inst.value.$type} ${instLabel(inst.value)}?
References to it in this file become null (list items pointing to it are removed).${warn}`)) return;
  }
  try {
    const r = await post('/api/object/' + what, { asset: doc.name, instance: inst.index });
    await reloadEbx();
    if (what === 'duplicate') { const i = current.doc.instances.findIndex((x) => x.guid === r.guid); if (i >= 0) focusInstance(r.guid); }
  } catch (e) { alert('Cannot ' + what + ' this object: ' + e.message); }
}
async function undo(id) { try { await post('/api/undo', { id }); } catch (e) { alert(e.message); } await reloadEbx(); }
async function listOp(doc, inst, what, p) {
  try { await post('/api/list/' + what, { asset: doc.name, instance: inst, path: p }); }
  catch (e) { alert('Cannot change this list: ' + e.message); }
  await reloadEbx();
}

// a small panel to choose where a reference points: nothing, an object of this file, or another asset
function refPicker(td, doc, inst, p) {
  const close = () => reloadEbx();
  const results = el('div', { class: 'picks' });
  const search = el('input', { placeholder: 'Search an asset to point to…', spellcheck: 'false' });
  let timer = null;
  search.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(async () => {
    if (!search.value.trim()) return results.replaceChildren();
    const r = await api('/api/assets?q=' + encodeURIComponent(search.value));
    results.replaceChildren(...r.results.map((n) => el('div', { class: 'pick', onclick: () => setValue(doc, inst, p, { ref: n }) }, n)), r.results.length ? null : el('div', { class: 'n' }, 'Nothing found.'));
  }, 250); });
  const local = el('select', {}, el('option', { value: '' }, 'An object in this file…'),
    doc.instances.map((x) => el('option', { value: x.index }, `#${x.index} ${x.value.$type} ${instLabel(x.value)}`)));
  local.addEventListener('change', () => { if (local.value !== '') setValue(doc, inst, p, { $instance: Number(local.value) }); });
  td.replaceChildren(el('div', { class: 'refbox' },
    el('div', { class: 'tools' }, el('button', { class: 'btn', onclick: () => setValue(doc, inst, p, null) }, 'Set to null'), local, el('button', { class: 'btn', onclick: close }, 'Cancel')),
    search, results,
    el('div', { class: 'n' }, 'Another asset: its main object is used. The game must have that asset loaded where this one is used, so prefer assets from the same bundles.')));
  search.focus();
}

// the value cell: shows the value; a click opens the right editor for its kind
function editCell(v, kind, doc, inst, p) {
  const [k, ref] = (kind || '').split(':');
  const shown = valueCell(v, kind, doc);
  if (!EDITABLE.test(k)) return el('td', { class: 'v' }, shown);
  const td = el('td', { class: 'v editable', title: 'Click to edit' }, shown);
  td.addEventListener('click', (e) => {
    if (e.target.closest('a,input,select,button,.refbox')) return;
    if (k === 'bool') return setValue(doc, inst, p, !v);
    if (k === 'ref') return refPicker(td, doc, inst, p);
    let input;
    if (k === 'enum') {
      input = el('select', {}, (doc.enums[ref] || [String(v)]).map((o) => el('option', { value: o, selected: o === String(v) }, o)));
      input.addEventListener('change', () => setValue(doc, inst, p, input.value));
      input.addEventListener('blur', () => reloadEbx());
    } else {
      const text = k === 'cstring' || k === 'fileref';
      input = el('input', { value: v === null ? '' : String(v), spellcheck: 'false', placeholder: text ? '(empty text)' : '' });
      const commit = () => setValue(doc, inst, p, text ? input.value : input.value.trim());
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') reloadEbx(); });
      input.addEventListener('blur', () => { if (input.value !== (v === null ? '' : String(v))) commit(); else reloadEbx(); });
    }
    td.replaceChildren(input); input.focus(); if (input.select) input.select();
  });
  return td;
}

const isPlain = (x) => x && typeof x === 'object' && !('$import' in x) && !('$instance' in x);
const removeBtn = (doc, inst, ip) => el('button', { class: 'undo rm', title: 'Remove this item from the list', onclick: (e) => { e.stopPropagation(); listOp(doc, inst, 'remove', ip); } }, '✕');

// rows of the property table; structs and arrays become collapsible groups. `p` is the field path ("Visibility.InvertValue").
function propRows(obj, doc, inst, base, depth, out) {
  for (const [key, v] of Object.entries(obj)) {
    if (key[0] === '@' || key[0] === '%' || key === '$type') continue;
    const kind = obj['%' + key];
    const p = base ? base + '.' + key : key;
    const pad = { style: `padding-left:${10 + depth * 16}px` };
    if (!isPlain(v)) {
      const edit = doc.edits[inst + '.' + p];
      out.push(el('tr', { class: edit ? 'edited' : '' }, el('td', { class: 'k', ...pad }, key), editCell(v, kind, doc, inst, p),
        el('td', { class: 'ty' }, edit ? el('button', { class: 'undo', title: 'Undo: back to ' + JSON.stringify(edit.original), onclick: () => undo(edit.id) }, '↺') : null, (kind || '').split(':')[0])));
      continue;
    }
    const arr = Array.isArray(v);
    const kids = [];
    if (arr) v.forEach((item, i) => {
      const ip = p + '.' + i;
      const ipad = `padding-left:${10 + (depth + 1) * 16}px`;
      if (isPlain(item)) {
        const sub = []; propRows(item, doc, inst, ip, depth + 2, sub);
        kids.push(el('tr', { class: 'item' }, el('td', { class: 'k', style: ipad, colspan: 2 }, `[${i}] `, el('span', { class: 'v-enum' }, item.$type || '')), el('td', { class: 'ty' }, removeBtn(doc, inst, ip))), ...sub);
      } else {
        const ik = item === null || (item && typeof item === 'object') ? 'ref' : '';
        kids.push(el('tr', { class: 'item' }, el('td', { class: 'k', style: ipad }, `[${i}]`), editCell(item, ik, doc, inst, ip), el('td', { class: 'ty' }, removeBtn(doc, inst, ip))));
      }
    });
    else propRows(v, doc, inst, p, depth + 1, kids);
    const tw = el('span', { class: 'tw' }, '▾');
    const fold = (hide) => { tw.textContent = hide ? '▸' : '▾'; kids.forEach((r) => { r.hidden = hide; }); };
    const changed = arr && doc.lists[inst + '.' + p];
    const head = el('tr', { class: 'grp' + (changed ? ' edited' : ''), onclick: () => fold(tw.textContent === '▾') },
      el('td', { class: 'k', ...pad }, tw, key),
      el('td', { class: 'v' }, el('span', { class: 'v-enum' }, arr ? `array [${v.length}]` : v.$type || ''),
        arr ? el('button', { class: 'btn add', title: v.length ? 'Add a copy of the last item' : 'Add an empty item', onclick: (e) => { e.stopPropagation(); listOp(doc, inst, 'append', p); } }, '＋ Add') : null,
        changed ? el('span', { class: 'badge' }, 'list changed') : null),
      el('td', { class: 'ty' }, arr ? 'array' : 'struct'));
    if (arr && v.length > 20) fold(true); // big arrays start folded
    out.push(head, ...kids);
  }
}

function showEbx(doc, keepOpen) {
  current = { doc };
  const many = doc.instances.length > 12;
  const blocks = doc.instances.map((inst) => {
    const rows = []; propRows(inst.value, doc, inst.index, '', 0, rows);
    const nEdits = Object.keys(doc.edits).filter((k) => k.startsWith(inst.index + '.')).length + Object.keys(doc.lists).filter((k) => k.startsWith(inst.index + '.')).length;
    const open = keepOpen ? keepOpen.has(inst.index) : !many || nEdits > 0;
    const box = el('div', { class: 'inst' + (open ? '' : ' closed'), 'data-i': inst.index },
      el('div', { class: 'ih', onclick: () => box.classList.toggle('closed') },
        el('span', { class: 'n' }, '#' + inst.index), el('span', { class: 't' }, inst.value.$type), el('span', { class: 'lbl' }, instLabel(inst.value)),
        inst.guid === doc.primaryGuid ? el('span', { class: 'n' }, '(primary)') : null,
        inst.isNew ? el('span', { class: 'badge new' }, 'new') : null,
        nEdits ? el('span', { class: 'badge' }, nEdits + ' edited') : null,
        el('span', { class: 'objtools' },
          el('button', { class: 'btn small', title: 'Add a copy of this object (with a new GUID). Point a reference or a list item to it to use it.', onclick: (e) => { e.stopPropagation(); objectOp(doc, inst, 'duplicate'); } }, 'Duplicate'),
          inst.guid === doc.primaryGuid ? null : el('button', { class: 'btn small danger', title: 'Remove this object; references to it become null', onclick: (e) => { e.stopPropagation(); objectOp(doc, inst, 'delete'); } }, 'Delete'))),
      el('div', { class: 'ib' }, el('table', { class: 'props' }, rows)));
    return box;
  });
  view.replaceChildren(el('h1', {}, doc.name),
    el('div', { class: 'meta' }, `${doc.instances.length} object(s) · ${doc.size.toLocaleString()} bytes · ${doc.source} · guid ${doc.guid}`),
    bundleList(doc.bundles), usedByList(doc.usedBy, doc.usedByCount),
    el('p', { class: 'hint0' }, 'Click a value to change it (also texts and references). Lists: ＋ Add copies the last item, ✕ removes one. Objects: Duplicate makes a copy (point a reference or list item to it), Delete removes one. Changes are kept in the project (top right) until you save them as a mod.'),
    ...blocks);
}

async function reloadEbx() {
  if (!current) return;
  const keep = new Set([...view.querySelectorAll('.inst:not(.closed)')].map((b) => Number(b.dataset.i)));
  const top = view.scrollTop;
  const doc = await api('/api/ebx?name=' + encodeURIComponent(current.doc.name));
  showEbx(doc, keep);
  view.scrollTop = top;
  refreshProjectButton();
}

// unfold an object of the open file, scroll to it and flash it
function focusInstance(guid) {
  const i = current && current.doc.instances.findIndex((x) => x.guid === guid);
  const box = i >= 0 ? view.querySelector(`.inst[data-i="${i}"]`) : null;
  if (!box) return;
  box.classList.remove('closed');
  box.scrollIntoView({ block: 'start' });
  box.classList.add('flash'); setTimeout(() => box.classList.remove('flash'), 1500);
}

// files that reference this asset
function usedByList(names, count) {
  if (!count) return el('div', { class: 'bundles' }, 'Used by: no other ebx file references this one.');
  return el('details', { class: 'bundles' }, el('summary', {}, `Used by ${count} file(s)`),
    el('div', {}, names.map((n) => el('div', {}, el('a', { href: '#', class: 'link', onclick: (e) => { e.preventDefault(); openAsset({ name: n, kind: 'ebx' }); } }, n))),
      count > names.length ? el('div', {}, `… and ${count - names.length} more`) : null));
}

// which bundles contain the asset (tells which car, level or menu it belongs to)
function bundleList(bundles) {
  if (!bundles || !bundles.length) return null;
  const short = (b) => b.replace(/^win32\//i, '');
  return el('details', { class: 'bundles' }, el('summary', {}, `In ${bundles.length} bundle(s): ${short(bundles[0])}${bundles.length > 1 ? ', …' : ''}`),
    el('div', {}, bundles.map((b) => el('div', {}, short(b)))));
}

// ---------------------------------------------------------------- project panel
async function refreshProjectButton() {
  const p = await api('/api/project');
  const n = p.changes.length + p.textures.length + p.texts.length;
  projBtn.textContent = `Project: ${n} change(s)`;
  projBtn.classList.toggle('on', n > 0);
}

async function showProject() {
  current = null;
  if (selectedRow) selectedRow.classList.remove('sel');
  const p = await api('/api/project');
  const f = {};
  const field = (key, label, attrs = {}) => { f[key] = el(attrs.rows ? 'textarea' : 'input', { value: attrs.rows ? undefined : p[key] || '', ...attrs }); if (attrs.rows) f[key].value = p[key] || ''; return el('label', { class: 'fld' }, el('span', {}, label), f[key]); };
  const result = el('div', {});
  const save = async (install) => {
    try {
      const r = await post('/api/save', { name: f.name.value, version: f.version.value, author: f.author.value, description: f.description.value, install });
      result.replaceChildren(el('div', { class: 'ok' }, el('b', {}, 'Saved: '), r.file,
        r.installed ? el('div', {}, `Installed as "${r.id}" and enabled. Close the game and double-click apply_mods.bat (as administrator) to put it into the game.`) : el('div', {}, 'Share this file; players install it by dropping it on install_mod.bat.')));
    } catch (e) { result.replaceChildren(el('div', { class: 'err' }, e.message)); }
  };
  const texRows = p.textures.map((t) => el('tr', {},
    el('td', {}, el('a', { href: '#', onclick: (e) => { e.preventDefault(); openAsset({ name: t.asset, kind: 'texture' }); } }, t.asset.split('/').pop())),
    el('td', { class: 'n' }, 'texture'), el('td', {}, 'pixels'), el('td', { class: 'v' }, `replaced with your PNG (${t.w} × ${t.h})`),
    el('td', {}, el('button', { class: 'undo', title: 'Remove this replacement', onclick: async () => { await post('/api/texture/remove', { name: t.asset }); showProject(); refreshProjectButton(); } }, '✕'))));
  const textRows = p.texts.map((t) => el('tr', {},
    el('td', {}, el('a', { href: '#', onclick: (e) => { e.preventDefault(); showTexts(t.id); } }, 'text ' + t.id)),
    el('td', { class: 'n' }, 'all languages'), el('td', {}, 'text'), el('td', { class: 'v' }, JSON.stringify(t.original), ' → ', el('b', {}, JSON.stringify(t.value))),
    el('td', {}, el('button', { class: 'undo', title: 'Remove this change', onclick: async () => { await post('/api/text/unset', { id: t.id }); showProject(); refreshProjectButton(); } }, '✕'))));
  const short = (x) => { const s = JSON.stringify(x); return s && s.length > 80 ? s.slice(0, 77) + '…' : s; };
  const rows = p.changes.map((c) => el('tr', {},
    el('td', {}, el('a', { href: '#', onclick: (e) => { e.preventDefault(); openAsset({ name: c.asset, kind: 'ebx' }); } }, c.asset.split('/').pop())),
    el('td', { class: 'n' }, (c.type || '') + ' ' + (c.label || (c.where ? Object.entries(c.where).filter(([k]) => k !== '$type').map(([k, v]) => `${k}=${v}`).join(', ') : ''))),
    el('td', {}, c.path || ''),
    el('td', { class: 'v' }, c.op === 'duplicate' ? ['new copy ', el('b', {}, c.guid)] : c.op === 'delete' ? el('b', {}, 'delete object') : c.op === 'remove' ? ['remove item ', el('b', {}, short(c.original))] : c.op === 'append' ? ['add item ', el('b', {}, short(c.value))] : [short(c.original), ' → ', el('b', {}, short(c.value))]),
    el('td', {}, el('button', { class: 'undo', title: 'Remove this change', onclick: async () => { try { await post('/api/undo', { id: c.id }); } catch (e) { alert(e.message); } showProject(); refreshProjectButton(); } }, '✕'))));
  view.replaceChildren(el('h1', {}, 'Project'),
    el('div', { class: 'meta' }, 'Your changes. Save them as a .nfsmod file to share, or install it for yourself.'),
    p.changes.length || p.textures.length || p.texts.length ? el('table', { class: 'props changes' }, el('tr', {}, ...['Asset', 'Object', 'Field', 'Change', ''].map((h) => el('th', {}, h))), rows, texRows, textRows)
      : el('p', { class: 'hint0' }, 'No changes yet. Open an EBX asset and click a value to change it, or open a texture and replace it with a PNG.'),
    el('div', { class: 'form' }, field('name', 'Mod name'), field('version', 'Version'), field('author', 'Author'), field('description', 'Description', { rows: 3 })),
    el('div', { class: 'tools' },
      el('button', { class: 'btn primary', onclick: () => save(true) }, 'Save and install for me'),
      el('button', { class: 'btn', onclick: () => save(false) }, 'Save .nfsmod only'),
      el('span', { class: 'sep' }),
      el('button', { class: 'btn', onclick: async () => { if (confirm('Remove all changes from the project?')) { await post('/api/project/clear', {}); showProject(); refreshProjectButton(); } } }, 'Clear project')),
    result,
    el('details', { class: 'bundles' }, el('summary', {}, 'mod.json preview'), el('pre', {}, JSON.stringify(p.modJson, null, 2))));
}

async function showTexture(name, showModded) {
  const t = await api('/api/texture?name=' + encodeURIComponent(name));
  const fmt = { 0.5: 'DXT1', 1: 'DXT5', 4: 'RGBA 8-bit' }[t.bytesPerPixel] || `${t.bytesPerPixel} bytes/pixel`;
  let modded = !!(t.replaced && showModded !== false), alphaOn = true;
  const src = () => '/api/texture.png?name=' + encodeURIComponent(name) + (alphaOn ? '' : '&alpha=0') + (modded ? '&modded=1' : '');
  const img = el('img', { src: src(), alt: name });
  const busy = el('span', { class: 'n' }, modded ? 'compressing like the game does…' : '');
  img.addEventListener('load', () => { busy.textContent = ''; });
  img.addEventListener('error', () => { busy.textContent = ''; img.replaceWith(el('p', { class: 'err' }, 'This texture format cannot be shown yet.')); });
  const zoom = el('button', { class: 'btn', onclick: () => { img.classList.toggle('actual'); zoom.textContent = img.classList.contains('actual') ? 'Fit to window' : 'Actual size'; } }, 'Actual size');
  // background behind transparent pixels: the grey checkerboard is the usual "transparent" marker, not part of the texture
  const bgs = [['checker', 'Checker = transparent'], ['black', 'Black'], ['white', 'White']].map(([k, label]) => {
    const b = el('button', { class: 'btn' + (k === 'checker' ? ' on' : ''), onclick: () => {
      img.classList.remove('bg-black', 'bg-white'); if (k !== 'checker') img.classList.add('bg-' + k);
      bgs.forEach((x) => x.classList.toggle('on', x === b));
    } }, label);
    return b;
  });
  const alpha = el('button', { class: 'btn', title: 'Show the colour of every pixel, ignoring transparency', onclick: () => {
    alphaOn = alpha.classList.contains('on'); alpha.classList.toggle('on', !alphaOn); img.src = src();
  } }, 'Ignore transparency');

  // replacing the texture with your own PNG
  const file = el('input', { type: 'file', accept: 'image/png', hidden: true });
  const msg = el('div', {});
  file.addEventListener('change', async () => {
    const f = file.files[0];
    if (!f) return;
    msg.replaceChildren(el('div', { class: 'hint0' }, `Checking ${f.name}…`));
    try {
      const r = await fetch('/api/texture/replace?name=' + encodeURIComponent(name), { method: 'POST', headers: { 'Content-Type': 'image/png' }, body: f });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error);
      refreshProjectButton();
      showTexture(name, true);
    } catch (e) { msg.replaceChildren(el('div', { class: 'err' }, 'Cannot use this picture: ' + e.message)); }
  });
  let replaceTools = null;
  if (!t.importable) replaceTools = el('span', { class: 'n' }, 'Replacing this texture format is not supported yet (only DXT1 and DXT5).');
  else if (!t.replaced) replaceTools = el('button', { class: 'btn primary', onclick: () => file.click() }, 'Replace with PNG…');
  else {
    const views = [['Original', false], ['Modded (as in game)', true]].map(([label, m]) => {
      const b = el('button', { class: 'btn' + (m === modded ? ' on' : ''), onclick: () => {
        modded = m; views.forEach((x) => x.classList.toggle('on', x === b));
        busy.textContent = m ? 'compressing like the game does…' : ''; img.src = src();
      } }, label);
      return b;
    });
    replaceTools = [el('span', { class: 'badge' }, 'replaced'), ...views,
      el('button', { class: 'btn', onclick: () => file.click() }, 'Another PNG…'),
      el('button', { class: 'btn', onclick: async () => { await post('/api/texture/remove', { name }); refreshProjectButton(); showTexture(name); } }, 'Remove replacement')];
  }
  view.replaceChildren(el('h1', {}, name), el('div', { class: 'meta' }, `${t.width} × ${t.height} · ${fmt} (format code ${t.format})`), bundleList(t.bundles),
    t.ebx ? el('div', { class: 'bundles' }, 'Asset: ', el('a', { href: '#', class: 'link', onclick: (e) => { e.preventDefault(); openAsset({ name: t.ebx, kind: 'ebx' }); } }, t.ebx)) : null,
    usedByList(t.usedBy, t.usedByCount),
    el('div', { class: 'tools' }, replaceTools, file),
    t.replaced ? el('p', { class: 'hint0' }, `Your picture is ${t.replaced.w} × ${t.replaced.h}; the game gets it resized to ${t.width} × ${t.height} and compressed as ${fmt}. "Modded" shows exactly that.`) : null,
    msg,
    el('div', { class: 'tools' }, zoom, el('span', { class: 'sep' }), el('span', { class: 'n' }, 'Background:'), ...bgs, el('span', { class: 'sep' }), alpha, busy),
    el('div', { class: 'texview' }, img));
}

// ---------------------------------------------------------------- texts the player sees
async function showTexts(initial) {
  current = null;
  if (selectedRow) selectedRow.classList.remove('sel');
  const box = el('input', { class: 'tq', placeholder: 'Search texts (words or an 8-digit id), e.g. debug, free roam, ef524206', value: initial || '', autocomplete: 'off' });
  const onlyEdited = el('button', { class: 'btn', title: 'Show only the texts you changed' }, 'Only my changes');
  const list = el('div', {});
  const info = el('div', { class: 'meta' });
  let timer = null, only = false;
  async function load() {
    const r = await api('/api/texts?q=' + encodeURIComponent(only ? '' : box.value));
    info.textContent = `${r.total.toLocaleString()} texts · languages: ${r.languages.join(', ')}` + (r.languages.length > 1 ? ' · a change applies to every language' : '');
    if (!only && !box.value.trim()) { list.replaceChildren(el('p', { class: 'hint0' }, 'Type a word to find a text. Click a text to change it: Enter saves, Esc cancels. Any length is fine.')); return; }
    const rows = r.results.map((x) => textRow(x, r.languages));
    list.replaceChildren(rows.length ? el('table', { class: 'props texts' }, rows) : el('p', { class: 'hint0' }, 'Nothing found.'),
      r.more ? el('p', { class: 'hint0' }, 'Showing the first 300 — add more words to narrow down.') : null);
  }
  function textRow(x, langs) {
    const shown = x.edited !== null ? x.edited : x.texts[langs[0]];
    const cell = el('td', { class: 'v editable', title: 'Click to edit' }, shown === '' ? el('span', { class: 'v-null' }, '(empty)') : shown);
    cell.addEventListener('click', () => {
      if (cell.querySelector('textarea')) return;
      const ta = el('textarea', { rows: Math.min(6, Math.max(1, Math.ceil(shown.length / 70))), spellcheck: 'false' });
      ta.value = shown;
      const save = async () => {
        try { await post('/api/text/set', { id: x.id, value: ta.value }); } catch (e) { alert('Cannot use this text: ' + e.message); }
        refreshProjectButton(); load();
      };
      ta.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); save(); } // Shift+Enter: new line
        if (e.key === 'Escape') load();
      });
      ta.addEventListener('blur', () => { if (ta.value !== shown) save(); else load(); });
      cell.replaceChildren(ta); ta.focus(); ta.select();
    });
    return el('tr', { class: x.edited !== null ? 'edited' : '' },
      el('td', { class: 'k n' }, x.id), cell,
      el('td', { class: 'ty' }, x.edited !== null ? el('button', { class: 'undo', title: 'Undo: back to ' + JSON.stringify(x.texts[langs[0]]), onclick: async () => { await post('/api/text/unset', { id: x.id }); refreshProjectButton(); load(); } }, '↺') : null));
  }
  box.addEventListener('input', () => { only = false; onlyEdited.classList.remove('on'); clearTimeout(timer); timer = setTimeout(load, 250); });
  onlyEdited.addEventListener('click', () => { only = !only; onlyEdited.classList.toggle('on', only); load(); });
  view.replaceChildren(el('h1', {}, 'Texts'), info,
    el('p', { class: 'hint0' }, 'Menu items, car names, hints, subtitles. Changes go into the project like any other edit. Characters the game font does not have may not show up in the game.'),
    el('div', { class: 'tools' }, box, onlyEdited), list);
  box.focus();
  load();
}
</script>
